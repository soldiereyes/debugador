openapi: 3.1.0
info:
  title: Debugador API
  version: 0.1.0
  description: API do Debugador de desenhos técnicos de software.

servers:
  - url: http://localhost:8080/api/v1

paths:
  /:
    get:
      operationId: apiInfo
      responses:
        "200":
          description: API information

  /projects:
    get:
      operationId: listProjects
      responses:
        "200":
          description: Projects
    post:
      operationId: createProject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"

components:
  schemas:
    CreateProjectRequest:
      type: object
      required: [name, repository]
      properties:
        name:
          type: string
        repository:
          type: object
          required: [provider, url, defaultBranch]
          properties:
            provider:
              type: string
              example: GITHUB
            url:
              type: string
              format: uri
            defaultBranch:
              type: string
              example: main

    Project:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        repositoryUrl:
          type: string
          format: uri
        defaultBranch:
          type: string
